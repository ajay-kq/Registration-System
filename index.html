<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registration | Join Now</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
            max-height: 100vh;
        }

        .card {
            background: rgba(8, 16, 30, 0.65);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.13);
            border-radius: 28px;
            padding: 36px 28px;
            width: 100%;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 0 0 1px rgba(37, 211, 102, 0.08);
            animation: floatIn .8s cubic-bezier(.2, .8, .2, 1);
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .logo {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(37, 211, 102, .45);
        }

        h1 {
            font-size: 26px;
            font-weight: 800;
            color: #e9edef;
            margin-bottom: 6px;
            text-align: center;
        }

        .desc {
            color: rgba(255, 255, 255, .45);
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
            margin-bottom: 28px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .irow {
            position: relative;
        }

        .ico {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        input {
            width: 100%;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 14px;
            padding: 14px 16px 14px 44px;
            color: white;
            font-size: 15px;
            outline: none;
            transition: all .25s;
        }

        input::placeholder {
            color: rgba(255, 255, 255, .3);
        }

        input:focus {
            border-color: rgba(37, 211, 102, .5);
            background: rgba(37, 211, 102, .06);
            box-shadow: 0 0 0 3px rgba(37, 211, 102, .12);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, .2);
            font-size: 11px;
            letter-spacing: .5px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, .1);
        }

        button[type=submit] {
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all .2s;
            box-shadow: 0 4px 20px rgba(37, 211, 102, .35);
        }

        button[type=submit]:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 211, 102, .55);
        }

        button[type=submit]:active {
            transform: scale(.97);
        }

        button[type=submit]:disabled {
            opacity: .7;
            cursor: not-allowed;
        }

        .loader {
            width: 18px;
            height: 18px;
            border: 2.5px solid rgba(255, 255, 255, .3);
            border-top: 2.5px solid white;
            border-radius: 50%;
            animation: spin .7s linear infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #success-page {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 32px;
            background: radial-gradient(ellipse at center, rgba(37, 211, 102, .15) 0%, rgba(0, 0, 0, .96) 80%);
            backdrop-filter: blur(12px);
        }

        .sicon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: popIn .6s cubic-bezier(.34, 1.56, .64, 1);
        }

        @keyframes popIn {
            from {
                transform: scale(0) rotate(-180deg)
            }

            to {
                transform: scale(1) rotate(0)
            }
        }

        .wbtn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
            margin-top: 28px;
            box-shadow: 0 8px 24px rgba(37, 211, 102, .4);
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {

            0%,
            100% {
                box-shadow: 0 8px 24px rgba(37, 211, 102, .4)
            }

            50% {
                box-shadow: 0 12px 40px rgba(37, 211, 102, .7)
            }
        }
    </style>
</head>

<body>
    <canvas id="bg"></canvas>
    <div class="wrap">
        <div class="card">
            <div class="logo">✓</div>
            <h1>Secure Register</h1>
            <p class="desc">Join our community in less than a minute.<br>Enter your details below.</p>
            <form id="form">
                <div class="irow"><span class="ico">👤</span><input type="text" id="name" placeholder="Full Name"
                        required autocomplete="name" /></div>
                <div class="irow"><span class="ico">✉️</span><input type="email" id="email" placeholder="Email Address"
                        required autocomplete="email" /></div>
                <div class="irow"><span class="ico">📱</span><input type="tel" id="phone" placeholder="Phone Number"
                        required autocomplete="tel" /></div>
                <div class="divider">Secure &amp; Encrypted</div>
                <button type="submit" id="submit-btn"><span>Join Now 🚀</span>
                    <div class="loader" id="loader"></div>
                </button>
            </form>
        </div>
    </div>
    <div id="success-page">
        <div class="sicon">🎉</div>
        <h2 style="font-size:28px;margin-bottom:12px;color:white;">Registration Confirmed!</h2>
        <p style="color:rgba(255,255,255,.6);line-height:1.6;">Welcome to the family!<br>Your unique ID: <b
                id="reg-id-display" style="color:#25D366;font-size:20px;"></b></p>
        <p style="margin-top:20px;font-size:13px;color:rgba(255,255,255,.35);">Redirecting to WhatsApp in 3 seconds...
        </p>
        <a href="#" id="wa-link" class="wbtn">🔗 Join WhatsApp Group</a>
    </div>
    <script>
        // ── CANVAS SETUP ──────────────────────────────────────
        const C = document.getElementById('bg'), X = C.getContext('2d');
        let W, H, MID, frame = 0, lastShoot = 0;
        function resize() { W = C.width = window.innerWidth; H = C.height = window.innerHeight; MID = H * .5; initAll(); }
        window.addEventListener('resize', resize);

        // ── STARS ─────────────────────────────────────────────
        let stars = [];
        function mkStars() { stars = []; for (let i = 0; i < 250; i++)stars.push({ x: rnd(W), y: rnd(MID * .95), r: rnd(1.6) + .2, a: rnd(.8) + .2, sp: rnd(.025) + .005, ph: rnd(Math.PI * 2) }); }

        // ── SHOOTING STARS ────────────────────────────────────
        let shoots = [];
        function spawnShoot() { if (shoots.length < 3) shoots.push({ x: rnd(W * .7), y: rnd(MID * .4), len: rnd(130) + 60, sp: rnd(9) + 6, a: 1, ang: Math.PI / 5 }); }

        // ── BUBBLES ───────────────────────────────────────────
        let bubs = [];
        function mkBubs() { bubs = []; for (let i = 0; i < 28; i++)bubs.push({ x: rnd(W), y: MID + rnd(H - MID), r: rnd(6) + 2, sp: rnd(.9) + .25, wb: rnd(Math.PI * 2), a: rnd(.35) + .15 }); }

        // ── PLANTS ────────────────────────────────────────────
        let plants = [];
        const plantCols = ['#1a6b1a', '#2d8a2d', '#0f5f0f', '#1e7a3a', '#228B22', '#2E8B57'];
        function mkPlants() {
            plants = [];
            [.04, .09, .14, .19, .75, .81, .87, .92, .97].forEach(px => {
                for (let s = 0; s < 3; s++)plants.push({ x: px * W + (rnd(30) - 15), h: rnd(90) + 55, sw: rnd(Math.PI * 2), ssp: rnd(.022) + .01, col: plantCols[rndI(plantCols.length)], lc: rndI(3) + 3 });
            });
        }

        // ── FISH ──────────────────────────────────────────────
        let fish = [];
        function mkFish() {
            fish = [
                { t: 'nemo', x: -120, lane: .61, d: 1, sp: 1.3, sz: 40, fr: 0 },
                { t: 'dory', x: W + 120, lane: .72, d: -1, sp: 1.7, sz: 44, fr: 0 },
                { t: 'betta', x: -100, lane: .82, d: 1, sp: .9, sz: 36, fr: 0 },
                { t: 'angel', x: W + 120, lane: .67, d: -1, sp: 1.1, sz: 46, fr: 0 },
                { t: 'guppy', x: -80, lane: .76, d: 1, sp: 2.2, sz: 25, fr: Math.PI },
                { t: 'guppy', x: W + 80, lane: .88, d: -1, sp: 2.5, sz: 22, fr: 0 },
                { t: 'arowana', x: W + 160, lane: .57, d: -1, sp: 1.0, sz: 68, fr: 0 },
                { t: 'flowhorn', x: -130, lane: .93, d: 1, sp: .75, sz: 54, fr: 1 },
            ];
        }
        function initAll() { mkStars(); mkBubs(); mkPlants(); mkFish(); }

        // ── HELPERS ───────────────────────────────────────────
        function rnd(n) { return Math.random() * (n || 1); }
        function rndI(n) { return Math.floor(Math.random() * n); }

        // ── DRAW FISH ─────────────────────────────────────────
        function drawFish(f, tw) {
            const s = f.sz, dir = f.d;
            X.save(); X.scale(dir, 1);
            const t = f.t;
            if (t === 'nemo') {
                // Tail
                X.beginPath(); X.moveTo(s * .6, -s * .4); X.lineTo(s * .95, 0); X.lineTo(s * .6, s * .4); X.closePath(); X.fillStyle = '#e65c00'; X.fill();
                // Body
                X.beginPath(); X.ellipse(0, 0, s * .58, s * .33, 0, 0, Math.PI * 2); X.fillStyle = '#ff6b00'; X.fill();
                // Stripes
                ['rgba(255,255,255,.85)'].forEach(c => { X.fillStyle = c;[-.05, -.33].forEach(ox => { X.beginPath(); X.ellipse(ox * s, 0, s * .075, s * .32, .1, 0, Math.PI * 2); X.fill(); }); });
                eye(s * .44, s * .1, s * .1);
            } else if (t === 'dory') {
                X.beginPath(); X.moveTo(s * .55, -s * .48); X.lineTo(s * .9, 0); X.lineTo(s * .55, s * .48); X.closePath(); X.fillStyle = '#1565C0'; X.fill();
                X.beginPath(); X.ellipse(0, 0, s * .56, s * .38, 0, 0, Math.PI * 2); X.fillStyle = '#1976D2'; X.fill();
                X.beginPath(); X.ellipse(s * .2, s * .22, s * .5, s * .1, 0, 0, Math.PI * 2); X.fillStyle = '#FFD600'; X.fill();
                fin(-s * .1, -s * .36, s * .1, -s * .58, s * .32, -s * .36, '#1565C0');
                eye(s * .38, s * .1, s * .1);
            } else if (t === 'betta') {
                const tw2 = Math.sin(tw) * .3;
                X.beginPath(); X.moveTo(s * .5, 0); X.quadraticCurveTo(s * .85 + tw2 * s, -s * .6, s * 1.1, -s * .7); X.quadraticCurveTo(s * 1.2, 0, s * 1.1, s * .7); X.quadraticCurveTo(s * .85 - tw2 * s, s * .6, s * .5, 0);
                const tg = X.createLinearGradient(s * .5, 0, s * 1.2, 0); tg.addColorStop(0, '#7B1FA2'); tg.addColorStop(1, 'rgba(186,104,200,.35)'); X.fillStyle = tg; X.fill();
                X.beginPath(); X.ellipse(0, 0, s * .5, s * .27, 0, 0, Math.PI * 2);
                const bg = X.createLinearGradient(-s * .5, 0, s * .5, 0); bg.addColorStop(0, '#6A1B9A'); bg.addColorStop(.5, '#AB47BC'); bg.addColorStop(1, '#7B1FA2'); X.fillStyle = bg; X.fill();
                fin(-s * .2, -s * .27, s * .08, -s * .54 + tw2 * s * .3, s * .33, -s * .27, 'rgba(186,104,200,.7)');
                eye(s * .38, s * .07, s * .09);
            } else if (t === 'angel') {
                X.beginPath(); X.moveTo(s * .2, -s * .1); X.lineTo(s * .62, 0); X.lineTo(s * .2, s * .1); X.closePath(); X.fillStyle = '#F57F17'; X.fill();
                X.beginPath(); X.moveTo(-s * .2, 0); X.quadraticCurveTo(-s * .05, -s * .55, s * .2, -s * .5); X.quadraticCurveTo(s * .35, -s * .2, s * .2, 0); X.quadraticCurveTo(s * .35, s * .2, s * .2, s * .5); X.quadraticCurveTo(-s * .05, s * .55, -s * .2, 0); X.closePath();
                const ag = X.createLinearGradient(-s * .3, 0, s * .4, 0); ag.addColorStop(0, '#FFCA28'); ag.addColorStop(.5, '#FFB300'); ag.addColorStop(1, '#F57F17'); X.fillStyle = ag; X.fill();
                X.strokeStyle = 'rgba(0,0,0,.2)'; X.lineWidth = 2;[-.05, .1].forEach(ox => { X.beginPath(); X.moveTo(ox * s, -s * .45); X.lineTo((ox + .05) * s, s * .45); X.stroke(); });
                eye(s * .1, s * .12, s * .09);
            } else if (t === 'guppy') {
                const tw2 = Math.sin(tw) * .4;
                X.beginPath(); X.moveTo(s * .5, 0); X.lineTo(s + tw2 * s * .5, -s * .6); X.lineTo(s * .8, 0); X.lineTo(s + tw2 * s * .5, s * .6); X.closePath();
                X.fillStyle = ['#E91E63', '#9C27B0', '#FF5722', '#2196F3'][rndI(4) > 2 ? 1 : 0]; X.fill();
                X.beginPath(); X.ellipse(0, 0, s * .5, s * .27, 0, 0, Math.PI * 2); X.fillStyle = '#FF9800'; X.fill();
                eye(s * .33, s * .09, s * .1);
            } else if (t === 'arowana') {
                const tw2 = Math.sin(tw) * .14;
                X.beginPath(); X.moveTo(-s * .65, -s * .11); X.bezierCurveTo(-s * .2, -s * .18 + tw2 * s, s * .2, s * .15 - tw2 * s, s * .65, -s * .08); X.lineTo(s * .65, s * .08); X.bezierCurveTo(s * .2, s * .15 + tw2 * s, -s * .2, -s * .18 - tw2 * s, -s * .65, s * .11); X.closePath();
                const sg = X.createLinearGradient(-s * .7, 0, s * .7, 0); sg.addColorStop(0, '#B0BEC5'); sg.addColorStop(.4, '#ECEFF1'); sg.addColorStop(1, '#78909C'); X.fillStyle = sg; X.fill();
                X.strokeStyle = 'rgba(100,150,200,.25)'; X.lineWidth = 1;
                for (let i = -5; i < 6; i++) { X.beginPath(); X.arc(i * s * .11, 0, s * .11, Math.PI * .1, Math.PI * .9); X.stroke(); }
                X.beginPath(); X.moveTo(s * .62, 0); X.lineTo(s * .98, -s * .22); X.lineTo(s * .98, s * .22); X.closePath(); X.fillStyle = '#78909C'; X.fill();
                eye(s * .54, s * .05, s * .09);
            } else if (t === 'flowhorn') {
                X.beginPath(); X.moveTo(s * .55, 0); X.lineTo(s, -s * .44); X.lineTo(s * .8, 0); X.lineTo(s, s * .44); X.closePath(); X.fillStyle = '#E64A19'; X.fill();
                X.beginPath(); X.ellipse(0, s * .05, s * .53, s * .37, 0, 0, Math.PI * 2);
                const fg = X.createLinearGradient(-s * .5, 0, s * .5, 0); fg.addColorStop(0, '#D84315'); fg.addColorStop(.4, '#FF7043'); fg.addColorStop(1, '#BF360C'); X.fillStyle = fg; X.fill();
                X.beginPath(); X.ellipse(-s * .37, -s * .27, s * .24, s * .21, -.5, 0, Math.PI * 2); X.fillStyle = '#FF5722'; X.fill();
                X.fillStyle = 'rgba(30,136,229,.55)';[[-s * .1, -s * .1], [s * .1, s * .05], [-s * .2, s * .1], [s * .25, -s * .05]].forEach(([bx, by]) => { X.beginPath(); X.arc(bx, by, s * .07, 0, Math.PI * 2); X.fill(); });
                fin(-s * .1, -s * .37, s * .2, -s * .63, s * .45, -s * .37, 'rgba(229,57,53,.65)');
                eye(s * .42, s * .1, s * .1);
            }
            X.restore();

            function eye(ex, ey, er) {
                X.beginPath(); X.arc(-ex, -ey, er, 0, Math.PI * 2); X.fillStyle = 'white'; X.fill();
                X.beginPath(); X.arc(-ex, -ey, er * .55, 0, Math.PI * 2); X.fillStyle = '#111'; X.fill();
            }
            function fin(x1, y1, cx, cy, x2, y2, col) {
                X.beginPath(); X.moveTo(x1, y1); X.quadraticCurveTo(cx, cy, x2, y2); X.fillStyle = col; X.fill();
            }
        }

        // ── ANIMATION LOOP ────────────────────────────────────
        function draw(ts) {
            requestAnimationFrame(draw);
            X.clearRect(0, 0, W, H);
            frame++;

            // SPACE
            const sg = X.createLinearGradient(0, 0, 0, MID);
            sg.addColorStop(0, '#01011a'); sg.addColorStop(.55, '#050a2e'); sg.addColorStop(1, '#0d1b50');
            X.fillStyle = sg; X.fillRect(0, 0, W, MID);

            // Nebulae
            [[W * .2, MID * .3, 170, 'rgba(90,0,160,.09)'], [W * .72, MID * .5, 140, 'rgba(0,60,160,.1)'], [W * .48, MID * .12, 110, 'rgba(200,50,50,.06)']].forEach(([nx, ny, nr, nc]) => {
                const ng = X.createRadialGradient(nx, ny, 0, nx, ny, nr); ng.addColorStop(0, nc); ng.addColorStop(1, 'transparent');
                X.fillStyle = ng; X.fillRect(nx - nr, ny - nr, nr * 2, nr * 2);
            });

            // Moon
            const mx = W * .82, my = MID * .2, mr = 38;
            const mg2 = X.createRadialGradient(mx, my, mr, mx, my, mr * 3); mg2.addColorStop(0, 'rgba(255,240,180,.14)'); mg2.addColorStop(1, 'transparent');
            X.fillStyle = mg2; X.beginPath(); X.arc(mx, my, mr * 3, 0, Math.PI * 2); X.fill();
            const mg = X.createRadialGradient(mx - mr * .3, my - mr * .3, 0, mx, my, mr); mg.addColorStop(0, '#FFFDE7'); mg.addColorStop(1, '#F9A825');
            X.beginPath(); X.arc(mx, my, mr, 0, Math.PI * 2); X.fillStyle = mg; X.fill();
            X.fillStyle = 'rgba(0,0,0,.1)';[[mx + mr * .2, my - mr * .1, mr * .15], [mx - mr * .2, my + mr * .3, mr * .1]].forEach(([cx, cy, cr]) => { X.beginPath(); X.arc(cx, cy, cr, 0, Math.PI * 2); X.fill(); });

            // Stars
            stars.forEach(s => { s.ph += s.sp; const a = (Math.sin(s.ph) * .4 + .6) * s.a; X.beginPath(); X.arc(s.x, s.y, s.r, 0, Math.PI * 2); X.fillStyle = `rgba(255,255,255,${a})`; X.fill(); });

            // Shooting stars
            if (ts - lastShoot > 4200 + rnd(3000)) { spawnShoot(); lastShoot = ts; }
            shoots = shoots.filter(s => s.a > 0);
            shoots.forEach(s => {
                const sg2 = X.createLinearGradient(s.x, s.y, s.x - s.len * Math.cos(s.ang), s.y + s.len * Math.sin(s.ang));
                sg2.addColorStop(0, 'white'); sg2.addColorStop(1, 'transparent');
                X.save(); X.globalAlpha = s.a; X.beginPath(); X.moveTo(s.x, s.y); X.lineTo(s.x + s.len * Math.cos(s.ang), s.y + s.len * Math.sin(s.ang)); X.strokeStyle = sg2; X.lineWidth = 2; X.stroke(); X.restore();
                s.x += s.sp * Math.cos(s.ang); s.y += s.sp * Math.sin(s.ang); s.a -= .016;
            });

            // AQUARIUM
            const aq = X.createLinearGradient(0, MID, 0, H);
            aq.addColorStop(0, '#001533'); aq.addColorStop(.4, '#002050'); aq.addColorStop(.85, '#001840'); aq.addColorStop(1, '#000d1a');
            X.fillStyle = aq; X.fillRect(0, MID, W, H - MID);

            // Light rays
            for (let i = 0; i < 5; i++) { const rx = W * (.08 + i * .2); const rg = X.createLinearGradient(rx, MID, rx + 60, H); rg.addColorStop(0, 'rgba(100,190,255,.05)'); rg.addColorStop(1, 'transparent'); X.beginPath(); X.moveTo(rx - 20, MID); X.lineTo(rx + 60, H); X.lineTo(rx + 100, H); X.lineTo(rx + 30, MID); X.fillStyle = rg; X.fill(); }

            // Plants
            plants.forEach(p => {
                p.sw += p.ssp; const sway = Math.sin(p.sw) * 13;
                X.save(); X.strokeStyle = p.col; X.lineWidth = 3;
                X.beginPath(); X.moveTo(p.x, H - 22); X.quadraticCurveTo(p.x + sway * .5, H - p.h * .5, p.x + sway, H - p.h); X.stroke();
                for (let i = 0; i < p.lc; i++) { const ty = H - 22 - (p.h / p.lc) * (i + 1); const tx = p.x + sway * ((i + 1) / p.lc); const ld = i % 2 === 0 ? 1 : -1; X.beginPath(); X.moveTo(tx, ty); X.quadraticCurveTo(tx + ld * 18, ty - 10, tx + ld * 12, ty - 22); X.quadraticCurveTo(tx + ld * 5, ty - 12, tx, ty); X.fillStyle = p.col; X.fill(); }
                X.restore();
            });

            // Sand
            const sand = X.createLinearGradient(0, H - 35, 0, H); sand.addColorStop(0, '#5D4037'); sand.addColorStop(.5, '#795548'); sand.addColorStop(1, '#4E342E');
            X.fillStyle = sand; X.beginPath(); X.moveTo(0, H - 26);
            for (let x = 0; x <= W; x += 20)X.lineTo(x, H - 26 + Math.sin(x * .1 + frame * .004) * 4);
            X.lineTo(W, H); X.lineTo(0, H); X.closePath(); X.fill();

            // Fish
            fish.forEach(f => {
                f.fr += .05; f.x += f.sp * f.d;
                const fy = f.lane * H + Math.sin(f.fr * .7) * 10;
                if (f.d === 1 && f.x > W + 200) { f.x = -160; f.lane = .55 + rnd(.4); }
                else if (f.d === -1 && f.x < -200) { f.x = W + 160; f.lane = .55 + rnd(.4); }
                X.save(); X.translate(f.x, fy); drawFish(f, f.fr); X.restore();
            });

            // Bubbles
            bubs.forEach(b => {
                b.y -= b.sp; b.wb += .04; b.x += Math.sin(b.wb) * .5;
                if (b.y < MID) { b.y = H - 20; b.x = rnd(W); }
                X.save(); X.globalAlpha = b.a; X.beginPath(); X.arc(b.x, b.y, b.r, 0, Math.PI * 2); X.strokeStyle = 'rgba(150,220,255,.6)'; X.lineWidth = 1; X.stroke();
                X.beginPath(); X.arc(b.x - b.r * .3, b.y - b.r * .3, b.r * .3, 0, Math.PI * 2); X.fillStyle = 'rgba(255,255,255,.4)'; X.fill();
                X.restore();
            });

            // Water surface shimmer
            X.save(); X.globalAlpha = .5; X.beginPath(); X.moveTo(0, MID);
            for (let x = 0; x <= W; x += 8)X.lineTo(x, MID + Math.sin(x * .02 + frame * .03) * 4);
            X.strokeStyle = 'rgba(150,220,255,.55)'; X.lineWidth = 2; X.stroke(); X.restore();

            // Water edge glow
            const wg = X.createLinearGradient(0, MID - 20, 0, MID + 20); wg.addColorStop(0, 'transparent'); wg.addColorStop(.5, 'rgba(100,200,255,.08)'); wg.addColorStop(1, 'transparent');
            X.fillStyle = wg; X.fillRect(0, MID - 20, W, 40);
        }

        resize();
        requestAnimationFrame(draw);

        // ── FORM LOGIC ────────────────────────────────────────
        const API_BASE = "/api";
        const form = document.getElementById("form");
        const submitBtn = document.getElementById("submit-btn");
        const loader = document.getElementById("loader");
        const btnText = submitBtn.querySelector('span');

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            submitBtn.disabled = true; loader.style.display = "block"; btnText.style.opacity = "0";
            const payload = { name: document.getElementById("name").value, email: document.getElementById("email").value, phone: document.getElementById("phone").value };
            try {
                const res = await fetch(`${API_BASE}/register`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                const data = await res.json();
                if (data.success) {
                    document.getElementById("reg-id-display").textContent = data.regId;
                    document.getElementById("wa-link").href = data.whatsappLink;
                    document.getElementById("success-page").style.display = "flex";
                    setTimeout(() => { window.location.href = data.whatsappLink; }, 3000);
                } else { alert("Error: " + data.message); resetUI(); }
            } catch (err) { alert("Connection failed: " + err.message); resetUI(); }
        });

        function resetUI() { submitBtn.disabled = false; loader.style.display = "none"; btnText.style.opacity = "1"; }
    </script>
</body>

</html>
